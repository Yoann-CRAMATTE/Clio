<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Icône de Clio, reprise du dessin que le manifeste web trace au canvas :
    encre sombre, cadre et lettrine dorés, trait de plume sous la lettre.
    Les proportions suivent le tracé d'origine, à l'échelle double (512 → 1024).

    Le cadre est posé à 12,5 % du bord : c'est la zone sûre des icônes
    adaptatives d'Android, qui rognent le pourtour selon la forme choisie par
    le système. Rien d'essentiel ne doit en sortir.
  -->
  <rect width="1024" height="1024" fill="#1a1208"/>
  <rect x="128" y="128" width="768" height="768"
        fill="none" stroke="#b8882a" stroke-width="16"/>
  <text x="512" y="492"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="496"
        fill="#d4a843" text-anchor="middle" dominant-baseline="central">C</text>
  <line x1="392" y1="712" x2="632" y2="712"
        stroke="#b8882a" stroke-width="12" stroke-linecap="butt"/>
</svg>
